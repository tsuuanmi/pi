name: Internet Package

on:
  push:
    branches: [main]
    paths:
      - "packages/internet/**"
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/orchestrator/**"
      - "package-lock.json"
      - ".github/workflows/internet.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/internet/**"
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/orchestrator/**"
      - "package-lock.json"
      - ".github/workflows/internet.yml"

concurrency:
  group: internet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace dependencies
        run: npm run build

      - name: Build internet package
        working-directory: packages/internet
        run: npm run build

      - name: Test internet package
        working-directory: packages/internet
        run: npm test

      - name: Smoke-test native runtime
        working-directory: packages/internet
        run: |
          ./dist/daemon/runtime/bin/codex-chatgpt-web --version
          node -e 'const manifest = require("./dist/daemon/runtime/manifest.json"); if (manifest.platform !== process.platform || manifest.arch !== process.arch) process.exit(1)'

      - name: Verify package contents
        working-directory: packages/internet
        run: npm pack --dry-run
